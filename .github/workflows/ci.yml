# Runs on every push and pull request: lint, tests, Docker build.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages (CPU-only PyTorch)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Make the NLTK data folder private to its owner
        # A newer NLTK refuses to load data from a folder that other accounts can write to, and the
        # GitHub runner creates the packages with group write permission. Without this, one index test fails.
        run: chmod -R go-w "$(python -c 'import llama_index.core, pathlib; print(pathlib.Path(llama_index.core.__file__).parent / "_static" / "nltk_cache")')"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t energiewende-agent .
